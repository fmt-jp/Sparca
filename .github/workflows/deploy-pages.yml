name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The same build, for the copy published on fmt-jp/open (job publish-open).
      - uses: actions/upload-artifact@v4
        with:
          name: hanabi-dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Also publish the build to https://fmt-jp.github.io/open/hanabi/ (repository fmt-jp/open,
  # folder hanabi/). Credentials, in order of preference:
  # - OPEN_DEPLOY_KEY: private key of a deploy key with write access on fmt-jp/open
  # - OPEN_REPO_TOKEN: fine-grained personal access token, "Contents: Read and write" on fmt-jp/open
  # Without either this job is skipped.
  publish-open:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-open
      cancel-in-progress: false
    steps:
      - id: auth
        env:
          KEY: ${{ secrets.OPEN_DEPLOY_KEY }}
          TOKEN: ${{ secrets.OPEN_REPO_TOKEN }}
        run: |
          if [ -n "$KEY" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
            echo "認証：デプロイキー（OPEN_DEPLOY_KEY）" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "認証：個人用アクセストークン（OPEN_REPO_TOKEN）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "OPEN_DEPLOY_KEY も OPEN_REPO_TOKEN も未設定のため、fmt-jp/open への公開をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.auth.outputs.mode == 'key'
        uses: actions/checkout@v4
        with:
          repository: fmt-jp/open
          ssh-key: ${{ secrets.OPEN_DEPLOY_KEY }}
          path: open
      - if: steps.auth.outputs.mode == 'token'
        uses: actions/checkout@v4
        with:
          repository: fmt-jp/open
          token: ${{ secrets.OPEN_REPO_TOKEN }}
          path: open
      - if: steps.auth.outputs.mode != 'none'
        uses: actions/download-artifact@v4
        with:
          name: hanabi-dist
          path: dist
      - if: steps.auth.outputs.mode != 'none'
        name: Update hanabi/ in fmt-jp/open
        run: |
          rm -rf open/hanabi
          cp -r dist open/hanabi
          cd open
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A hanabi
          if git diff --cached --quiet; then
            # Nothing to publish; still check that the credentials may push (a dry run
            # talks to the server's receive side, which refuses read-only access).
            git push --dry-run
            echo "変更なし（公開中の hanabi/ と同じビルド）。書き込み権限は確認済み。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "HANABI を更新（fmt-jp/Sparca ${GITHUB_SHA::7}）"
          git push
          echo "fmt-jp/open の hanabi/ を更新しました。" >> "$GITHUB_STEP_SUMMARY"
